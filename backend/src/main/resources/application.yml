spring:
  application:
    name: aegis-nexus
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis_nexus
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  security:
    jwt:
      secret: change-me-in-production-min-32-chars
      expiration: 86400000

# OpenSearch
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}

logging:
  level:
    root: INFO
    com.aegis.nexus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
